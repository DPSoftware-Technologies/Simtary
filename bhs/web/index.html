<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BHS test viewer</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px monospace; }
  #bar { padding: 6px 10px; background: #222; display: flex; gap: 12px; align-items: center; }
  video { display: block; width: 960px; max-width: 100vw; background: #000; cursor: crosshair; }
  #log { white-space: pre-wrap; padding: 6px 10px; height: 160px; overflow: auto; }
  input { background: #111; color: #ddd; border: 1px solid #444; padding: 2px 4px; }
</style>
</head>
<body>
<div id="bar">
  BHS test viewer
  <input id="url" size="24" value="ws://127.0.0.1:9000">
  <button id="go">connect</button>
  <span id="state">idle</span>
  <span id="stats"></span>
</div>
<video id="v" autoplay muted playsinline></video>
<div id="log"></div>
<script>
// Protocol: Simtary/bhs/PROTOCOL.md (draft v1). Key codes sent are USB HID usage ids (= SDL scancodes),
// the table in keycodes.md: W3C KeyboardEvent.code -> HID.
const HID = { Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Space: 44, ArrowRight: 79, ArrowLeft: 80, ArrowDown: 81, ArrowUp: 82,
  ControlLeft: 224, ShiftLeft: 225, AltLeft: 226, ControlRight: 228, ShiftRight: 229, AltRight: 230 };
for (let i = 0; i < 26; i++) HID['Key' + String.fromCharCode(65 + i)] = 4 + i;
for (let i = 1; i <= 9; i++) HID['Digit' + i] = 29 + i;
HID.Digit0 = 39;
for (let i = 1; i <= 12; i++) HID['F' + i] = 57 + i;
const $ = id => document.getElementById(id);
let ws, pc, input, control, seq = 0, pending = [], timer = null;

function log(m) { const l = $('log'); l.textContent += m + '\n'; l.scrollTop = l.scrollHeight; }
function send(o) { ws.send(JSON.stringify(o)); }
function state(s) { $('state').textContent = s; }

$('go').onclick = () => {
  if (ws) ws.close();
  ws = new WebSocket($('url').value, 'bhs.v1');
  ws.onopen = () => {
    state('signalling');
    send({ t: 'hello', protocol: 1, token: 'dev', app: 'test', scenario: 'pattern', params: {},
           caps: { video: ['h264'], audio: ['opus'], voice: false } });
  };
  ws.onclose = () => { state('closed'); log('signalling closed'); };
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'welcome') {
      log('welcome: session ' + m.session + ', viewer ' + m.viewer + ', state ' + m.state);
    } else if (m.t === 'offer') {
      pc = new RTCPeerConnection({ iceServers: (m.ice_servers || []) });
      window.pc = pc;
      pc.ontrack = e => { $('v').srcObject = e.streams[0] || new MediaStream([e.track]); log('track: ' + e.track.kind); };
      pc.onicecandidate = e => { if (e.candidate) send({ t: 'candidate', candidate: e.candidate.candidate, mid: e.candidate.sdpMid }); };
      pc.onconnectionstatechange = () => { state(pc.connectionState); log('pc ' + pc.connectionState); };
      pc.ondatachannel = e => {
        const ch = e.channel;
        log('data channel: ' + ch.label);
        if (ch.label === 'input') { input = ch; input.binaryType = 'arraybuffer'; }
        if (ch.label === 'control') {
          control = ch;
          ch.onmessage = e2 => {
            const c = JSON.parse(e2.data);
            if (c.t === 'stats') $('stats').textContent = 'fps ' + c.fps + '  encode ' + c.encode_ms + ' ms  ' + c.bitrate + ' kbps';
            else log('control: ' + e2.data);
          };
        }
      };
      await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      send({ t: 'answer', sdp: ans.sdp });
    } else if (m.t === 'candidate') {
      if (pc) await pc.addIceCandidate({ candidate: m.candidate, sdpMid: m.mid });
    } else if (m.t === 'error') {
      log('ERROR ' + m.code + ': ' + m.message);
    } else {
      log('? ' + ev.data);
    }
  };
};

// input events: u16 seq, then events back to back (kind u8 + payload), sent at most ~120 Hz
function queue(kind, ...bytes) { pending.push([kind, bytes]); if (!timer) timer = setTimeout(flush, 8); }
function flush() {
  timer = null;
  if (!input || input.readyState !== 'open' || pending.length === 0) { pending = []; return; }
  let size = 2;
  for (const [, b] of pending) size += 1 + b.reduce((n, x) => n + x.size, 0);
  const buf = new ArrayBuffer(size), dv = new DataView(buf);
  dv.setUint16(0, seq++ & 0xffff, true);
  let o = 2;
  for (const [kind, parts] of pending) {
    dv.setUint8(o++, kind);
    for (const p of parts) {
      if (p.size === 1) dv.setUint8(o, p.v); else if (p.size === 2 && p.signed) dv.setInt16(o, p.v, true); else dv.setUint16(o, p.v, true);
      o += p.size;
    }
  }
  pending = [];
  input.send(buf);
}
const u8 = v => ({ size: 1, v }), u16 = v => ({ size: 2, v }), i16 = v => ({ size: 2, v, signed: true });
const video = $('v');
function norm(e) {
  const r = video.getBoundingClientRect();
  return [Math.max(0, Math.min(65535, Math.round((e.clientX - r.left) / r.width * 65535))),
          Math.max(0, Math.min(65535, Math.round((e.clientY - r.top) / r.height * 65535)))];
}
video.addEventListener('mousemove', e => { const [x, y] = norm(e); queue(4, u16(x), u16(y)); });
video.addEventListener('mousedown', e => queue(5, u8(e.button), u8(1)));
window.addEventListener('mouseup', e => queue(5, u8(e.button), u8(0)));
video.addEventListener('wheel', e => { queue(6, i16(Math.round(e.deltaX)), i16(Math.round(e.deltaY))); e.preventDefault(); }, { passive: false });
video.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => { const k = HID[e.code]; if (k !== undefined && !e.repeat) { queue(1, u16(k), u8(0)); e.preventDefault(); } });
window.addEventListener('keyup', e => { const k = HID[e.code]; if (k !== undefined) { queue(2, u16(k), u8(0)); e.preventDefault(); } });
</script>
</body>
</html>
